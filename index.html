<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AR Accessibility Assistant</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!--  NAVBAR -->
    <nav class="navbar">
        <div class="nav-left">
            <button onclick="showPage('home')">Home</button>
            <button onclick="showPage('scan')">Scan</button>
            <button onclick="showPage('reader')">Reader</button>
        </div>
        <div class="nav-right">
            <button onclick="showPage('settings')">⚙️</button>
        </div>
    </nav>

    <!--  HOME PAGE -->
    <div id="home" class="page active">
        <div class="hero">
            <h1>Welcome to AR Accessibility Assistant</h1>
            <p>Helping visually impaired users detect objects and read text with AR technology.</p>
            <img src="ar-icon.png" alt="AR Illustration" class="hero-logo">
        </div>
    </div>

    <!-- SCAN PAGE -->
    <div id="scan" class="page">
        <div class="camera-container">
            <video id="camera" autoplay></video>
        </div>
        <div class="info-panel">
            <h3>Detection Info</h3>
            <p><strong>Object:</strong> <span id="obj">-</span></p>
            <p><strong>Distance:</strong> <span id="dist">-</span></p>
            <p><strong>Direction:</strong> <span id="dir">-</span></p>
        </div>
    </div>

    <!--  READER PAGE -->
    <div id="reader" class="page">
        <h3>Text Reader</h3>
        <input type="file" id="imageUpload">
        <button onclick="readText()">Read Text</button>
        <p id="readerOutput"></p>
    </div>

    <!--  SETTINGS PAGE -->
    <div id="settings" class="page">
        <h3>Settings</h3>
        <label>Speech Speed:</label>
        <input type="range" id="speed" min="0.5" max="2" step="0.1" value="1">
        <br><br>
        <button onclick="toggleVoice()">Toggle Voice</button>
    </div>
    <footer style="background-color:#f1f1f1; padding:20px; text-align:center;">
  <!-- Project name / AR guide first -->
  <p style="font-weight:bold; font-size:1.1em; color: Black;">© 2026 AR Accessibility Assistant </p>
